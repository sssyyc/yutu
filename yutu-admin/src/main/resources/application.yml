server:
  port: 8080

spring:
  application:
    name: yutu-admin
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yutu_travel?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.yutu.modules.model.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: yutu-platform-secret-key
  expire-seconds: 86400

app:
  token:
    redis-prefix: "YUTU:TOKEN:"
  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:30}
  file:
    upload-dir: uploads
  alipay:
    enabled: true
    protocol: https
    gateway-host: openapi-sandbox.dl.alipaydev.com
    app-id: 9021000140631563
    merchant-private-key: 
    alipay-public-key: 
